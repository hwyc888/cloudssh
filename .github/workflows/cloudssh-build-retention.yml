name: CloudSSH 构建记录清理

on:
  workflow_run:
    workflows:
      - CloudSSH 快速镜像构建
      - CloudSSH 正式发版
      - CloudSSH 发布镜像校验
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_RUN_ID: ${{ github.event.workflow_run.id }}
      WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
    steps:
      - name: 保留当前成功和上一个成功构建
        shell: bash
        run: |
          set -euo pipefail
          runs_file="$RUNNER_TEMP/cloudssh-workflow-runs.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID/runs?per_page=100" \
            > "$runs_file"

          previous_success="$(
            jq -r --arg current "$CURRENT_RUN_ID" '
              [.[].workflow_runs[]
                | select((.id | tostring) != $current)
                | select(.status == "completed" and .conclusion == "success")]
              | sort_by(.created_at) | reverse
              | (.[0].id // empty)
            ' "$runs_file"
          )"

          jq -r \
            --arg current "$CURRENT_RUN_ID" \
            --arg previous "$previous_success" '
              [.[].workflow_runs[]
                | select(.status == "completed")
                | select(.conclusion == "success" or .conclusion == "failure" or .conclusion == "cancelled")
                | select((.id | tostring) != $current)
                | select($previous == "" or (.id | tostring) != $previous)
                | .id]
              | unique[]
            ' "$runs_file" |
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            echo "删除旧的已完成构建记录：$run_id"
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
          done
